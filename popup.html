<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Fill Window</title>
<link rel="stylesheet" href="popup.css" />
</head>
<body>
  <!-- Ambient Glassmorphism Orbs -->
  <div class="glass-orb orb-1"></div>
  <div class="glass-orb orb-2"></div>
  <div class="glass-orb orb-3"></div>

  <!-- Frosted Glass Card -->
  <div class="panel glass-card">
    <header class="head">
      <div class="icon-wrap">
        <svg class="mark" viewBox="0 0 36 36" width="22" height="22" aria-hidden="true">
          <rect x="6" y="8" width="24" height="20" rx="3.5" fill="none" stroke="currentColor" stroke-width="2.2"/>
          <line x1="6" y1="14" x2="30" y2="14" stroke="currentColor" stroke-width="2"/>
        </svg>
      </div>
      <div class="head-text">
        <h1>Fill Window</h1>
        <span class="badge-red">YouTube</span>
      </div>
    </header>

    <p class="lede">Stretches video to your browser window's own edges. Built for split-screen & snapped windows.</p>

    <!-- Master Switch Card -->
    <button type="button" id="toggleRow" class="switch-row" aria-pressed="false">
      <div class="switch-content">
        <span class="switch-label">Fill this tab's window</span>
        <span class="switch-hint">Toggle full tab viewport</span>
      </div>
      <span class="switch" id="switchControl">
        <span class="switch-knob"></span>
      </span>
    </button>

    <div class="status-wrap">
      <span class="status-dot"></span>
      <p id="status" class="status" role="status"></p>
    </div>

    <div class="glass-divider"></div>

    <!-- Auto-Enable Row -->
    <label class="check-row">
      <div class="check-box-wrap">
        <input type="checkbox" id="autoEnable" />
        <span class="custom-check"></span>
      </div>
      <div class="check-text">
        <span class="check-title">Turn on automatically</span>
        <span class="check-desc">Applies to every video loaded</span>
      </div>
    </label>

    <!-- Shortcut Row -->
    <div class="shortcut-row">
      <span class="shortcut-label">Shortcut</span>
      <div class="shortcut-right">
        <kbd id="shortcutKeys">&hellip;</kbd>
        <button type="button" id="changeShortcut" class="link-btn">Change</button>
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
