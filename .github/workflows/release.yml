name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build extension zip
        run: |
          VERSION=${GITHUB_REF_NAME}
          zip -r "youtube-fill-window-${VERSION}.zip" manifest.json background.js content.js styles.css popup.html popup.css popup.js README.md icons/

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "youtube-fill-window-${GITHUB_REF_NAME}.zip" \
            --title "Release ${GITHUB_REF_NAME}" \
            --generate-notes
